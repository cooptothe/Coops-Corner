server.address=127.0.0.1
server.port=${CORNER_MARKET_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
spring.application.name=corner-market-api
spring.datasource.url=${CORNER_MARKET_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/odds_data_pipeline?connectTimeout=3&socketTimeout=8}
spring.datasource.username=${CORNER_MARKET_DB_USER:corner_reader_login}
spring.datasource.password=${CORNER_MARKET_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=4000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.read-only=true
spring.sql.init.mode=never
spring.jmx.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
corner.market.max-age-seconds=${CORNER_MARKET_MAX_AGE_SECONDS:120}
corner.market.dataset=${CORNER_MARKET_DATASET:retained}
logging.level.com.zaxxer.hikari=ERROR
corner.accounts.enabled=${CORNER_ACCOUNTS_ENABLED:false}
corner.accounts.url=${CORNER_ACCOUNTS_JDBC_URL:}
corner.accounts.user=${CORNER_ACCOUNTS_DB_USER:}
corner.accounts.password=${CORNER_ACCOUNTS_DB_PASSWORD:}
corner.live.enabled=${CORNER_LIVE_ENABLED:false}
spring.data.redis.url=${CORNER_LIVE_REDIS_URL:redis://127.0.0.1:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
